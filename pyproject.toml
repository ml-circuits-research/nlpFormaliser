[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "nlpformaliser"
version = "0.2.0"
description = "Round-trip formalisation of English into Prolog event logic (EVL), checked by execution back to English"
requires-python = ">=3.10"
dependencies = ["lemminflect"]

[project.optional-dependencies]
sdk = ["anthropic"]
amr = ["amrlib", "penman", "torch", "transformers==4.46.3", "sentencepiece"]

[project.scripts]
nlpf = "nlpformaliser.cli:main"

[tool.setuptools]
packages = ["nlpformaliser"]

[tool.setuptools.package-data]
nlpformaliser = ["*.pl", "*.md"]
